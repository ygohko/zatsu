name: test

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: RUST_BACKTRACE=1 cargo test --verbose commons::tests::object_is_savable
